name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux guards that the tree still compiles and vets away from the platform it
  # is developed on. The tests do not run here: termjump drives iTerm2 through
  # osascript and returns early on any other GOOS, so its suite asserts darwin
  # behaviour and would fail rather than skip.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # A called vulnerability fails the build. Advisories for code that is never
      # reached are reported by govulncheck without a non-zero exit.
      #
      # Pinned rather than @latest: govulncheck raises its own Go floor between
      # releases, and setup-go pins the toolchain to go.mod with GOTOOLCHAIN=local,
      # so @latest fails to build the day it outruns this module's Go version
      # rather than the day a vulnerability appears. The advisory database is
      # fetched at run time, so the pin dates the scanner, never its data. Raise it
      # alongside the go directive.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -race ./...
